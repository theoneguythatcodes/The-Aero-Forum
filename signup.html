<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up — The Aero Forum</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Aero Background -->

    <div class="aero-background">

        <div class="sun-flare"></div>

        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>

        <div class="aero-glow"></div>

    </div>


    <!-- Signup Window -->

    <main class="signup-page">

        <div class="signup-window">

            <div class="signup-header">

                <a href="index.html" class="forum-logo">
                    The Aero Forum
                </a>

            </div>


            <div class="signup-content">

                <h1 class="signup-title">
                    Create your Aero Account
                </h1>

                <p class="signup-subtitle">
                    Join the community and become part of The Aero Forum!
                </p>


                <form id="signup-form">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            maxlength="24"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Enter your password again"
                            minlength="8"
                            required
                        >

                    </div>


                    <div id="signup-message"></div>


                    <button
                        type="submit"
                        class="aero-button signup-submit"
                    >
                        Create Account
                    </button>

                </form>


                <p class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Log In
                    </a>

                </p>

            </div>

        </div>

    </main>


    <script type="module" src="js/auth.js"></script>
    

</body>

</html>
