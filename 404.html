<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — The Aero Forum</title>

    <link rel="icon" type="image/png" href="assets/favicon-logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="aero-background">

        <div class="sun-flare"></div>

        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>

        <div class="aero-glow"></div>

    </div>


    <main class="error-page">

        <div class="error-window">

            <nav class="aero-navbar">

                <a
                    href="index.html"
                    class="forum-logo"
                >
                    The Aero Forum
                </a>

                <div
                    class="nav-actions"
                    id="auth-nav"
                ></div>

            </nav>


            <section class="error-content">

                <div class="error-code">
                    404
                </div>

                <h1>
                    Page not found 🌊
                </h1>

                <p>
                    Looks like this page flew away.
                    It may have been moved, deleted,
                    or never existed.
                </p>

                <div class="error-actions">

                    <a
                        href="index.html"
                        class="aero-button"
                    >
                        ← Back to The Aero Forum
                    </a>

                </div>

            </section>

        </div>

    </main>


    <script
        type="module"
        src="js/auth.js"
    ></script>

</body>

</html>
