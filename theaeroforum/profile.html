<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon-logo.png">
    <title>Profile — The Aero Forum</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Aero Background -->

    <div class="aero-background">

        <div class="sun-flare"></div>

        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>

        <div class="aero-glow"></div>

    </div>


    <!-- Profile Window -->

    <main class="profile-page">

        <div class="profile-window">

            <!-- NAVBAR -->

            <nav class="aero-navbar">

                <a href="index.html" class="forum-logo">
                    The Aero Forum
                </a>

                <div
                    class="nav-actions"
                    id="auth-nav"
                >
                    <!-- Loaded by auth.js -->
                </div>

            </nav>


            <!-- PROFILE CONTENT -->

            <section class="profile-content">

                <div class="profile-card">

                    <div class="profile-avatar-wrapper">

                        <img
                            id="profile-avatar"
                            class="profile-avatar"
                            src="assets/default-avatar.png"
                            alt="Profile avatar"
                        >

                    </div>
                    <div class="profile-avatar-actions">

                        <label
                            for="avatar-upload"
                            class="profile-action-button"
                        >
                            📷 Change Avatar
                        </label>

                        <input
                            type="file"
                            id="avatar-upload"
                            accept="image/png,image/jpeg,image/webp"
                            hidden
                        >

                    </div>


                    <h1 id="profile-username">
                        Loading...
                    </h1>


                    <div
                        id="profile-rank"
                        class="profile-rank"
                    >
                        Loading...
                    </div>


                    <div
                        id="profile-role"
                        class="profile-role"
                    >
                        Member
                    </div>


                    <p
                        id="profile-bio"
                        class="profile-bio"
                    >
                        Welcome to The Aero Forum!
                    </p>


                    <!-- PROFILE ACTIONS -->

                    <div
                        id="profile-actions"
                        class="profile-actions"
                    >
                        <!-- Loaded by auth.js -->
                    </div>

                </div>


                <!-- PROFILE INFO -->

                <div class="profile-info-grid">

                    <div class="profile-info-card">

                        <span class="profile-info-label">
                            Member since
                        </span>

                        <strong id="profile-created">
                            Loading...
                        </strong>

                    </div>


                    <div class="profile-info-card">

                        <span class="profile-info-label">
                            Username
                        </span>

                        <strong id="profile-username-info">
                            Loading...
                        </strong>

                    </div>


                    <div class="profile-info-card">

                        <span class="profile-info-label">
                            Rank
                        </span>

                        <strong id="profile-rank-info">
                            Loading...
                        </strong>

                    </div>


                    <div class="profile-info-card">

                        <span class="profile-info-label">
                            Role
                        </span>

                        <strong id="profile-role-info">
                            Loading...
                        </strong>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- The Aero Forum Auth -->

    <script
        type="module"
        src="js/auth.js"
    ></script>

</body>

</html>
