<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories — The Aero Forum</title>

    <link rel="icon" type="image/png" href="assets/favicon-logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="aero-background">

        <div class="sun-flare"></div>

        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>

        <div class="aero-glow"></div>

    </div>


    <main class="category-page">

        <div class="category-window">

            <nav class="aero-navbar">

                <a href="index.html" class="forum-logo">
                    The Aero Forum
                </a>

                <div class="nav-actions" id="auth-nav">
                    <!-- auth.js inserts user navigation here -->
                </div>

            </nav>


            <div class="category-content">

                <section class="category-header">

                    <div
                        id="category-icon"
                        class="category-large-icon">
                    </div>

                    <div>

                        <h1 id="category-name">
                            Loading...
                        </h1>

                        <p id="category-description">
                            Loading category description...
                        </p>

                    </div>

                </section>


                <div
                    id="category-breadcrumb"
                    class="category-breadcrumb">
                    Home → Categories → Loading...
                </div>


                <section class="subcategories-section">

                    <h2>
                        Subcategories
                    </h2>

                    <div
                        id="subcategories"
                        class="subcategories-grid">
                    </div>

                </section>


                <section class="threads-section">

                    <div class="threads-header">

                        <h2>
                            Discussions
                        </h2>

                        <button
                            id="create-thread-button"
                            class="aero-button">
                            + Create Thread
                        </button>

                    </div>


                    <div
                        id="thread-list"
                        class="thread-list">

                        <div class="thread-loading">
                            Loading discussions...
                        </div>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/category.js"></script>

</body>

</html>
