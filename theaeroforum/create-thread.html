<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Thread — The Aero Forum</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
    <link rel="icon" type="image/png" href="assets/favicon-logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="aero-background">
        <div class="sun-flare"></div>

        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>

        <div class="aero-glow"></div>
    </div>


    <main class="create-thread-page">

        <div class="create-thread-window">

            <nav class="aero-navbar">

                <a href="index.html" class="forum-logo">
                    The Aero Forum
                </a>

                <div
                    class="nav-actions"
                    id="auth-nav">
                </div>

            </nav>


            <div class="create-thread-content">

                <div
                    id="category-location"
                    class="category-breadcrumb">
                    Loading category...
                </div>


                <h1 class="create-thread-title">
                    Create a Thread
                </h1>


                <form id="create-thread-form">

                    <div class="form-group">

                        <label for="thread-title">
                            Thread title
                        </label>

                        <input
                            type="text"
                            id="thread-title"
                            maxlength="120"
                            placeholder="What do you want to discuss?"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="thread-content">
                            Content
                        </label>

                        <textarea
                            id="thread-content"
                            rows="10"
                            maxlength="10000"
                            placeholder="Write your post..."
                            required
                        ></textarea>

                    </div>


                    <div
                        id="thread-message"
                        class="thread-message">
                    </div>


                    <div class="create-thread-actions">

                        <a
                            id="cancel-thread"
                            href="index.html"
                            class="nav-button">
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="aero-button">
                            Create Thread 🌊
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/create-thread.js"></script>

</body>

</html>
